name: checks

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - "src/**"
      - "*.ts"
      - "*.json"
      - "*.css"
      - "bun.lock"
      - ".github/workflows/ci.yml"
  push:
    branches: [master]
    paths:
      - "src/**"
      - "*.ts"
      - "*.json"
      - "*.css"
      - "bun.lock"
      - ".github/workflows/ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: check format
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile

      - run: bunx oxfmt --check .

  lint:
    name: lint
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile

      - run: bun run lint

  type-check:
    name: Type check
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile

      - run: bun run typegen

      - run: bun x tsc --noEmit

  test:
    name: Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile

      - run: bun run test
