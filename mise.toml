[tools]
bun = "1.4.3"
node = "26.12.0"

[tasks.install]
description = "Install dependencies from bun.lock without resolving."
run = "bun install --frozen-lockfile"

[tasks.lint]
description = "Check lint and formatting, Markdown included. Writes nothing."
run = ["bunx oxlint --deny-warnings .", "bunx oxfmt --check ."]

[tasks.fix]
description = "Apply safe lint fixes and format every file."
run = ["bunx oxlint --fix .", "bunx oxfmt ."]

[tasks.typegen]
description = "Generate worker-configuration.d.ts from wrangler.jsonc. The file is ignored by git."
run = "bunx wrangler types --env-interface CloudflareEnv"

[tasks.typecheck]
description = "Type check with tsc."
depends = ["typegen"]
run = "bunx tsc --noEmit"

[tasks.test]
description = "Run the vitest suite against local workerd instances."
run = "bunx vitest run"

[tasks.build]
description = "Build the Worker with OpenNext. Output goes to ignored .next and .open-next."
depends = ["typegen"]
# The build empties .open-next, which the database tests' workerd instances read as assets.
wait_for = ["test"]
run = "bunx opennextjs-cloudflare build"

[tasks.check]
description = "Lint, type check, test and build. Writes only ignored files."
depends = ["lint", "typecheck", "test", "build"]

[tasks.knip]
description = "Report unused files, exports and dependencies."
run = "bunx knip"

[tasks."knip:fix"]
description = "Remove what knip reports as unused."
run = "bunx knip --fix"

[tasks.dev]
description = "Apply migrations to the local database and start Next.js."
depends = ["db:migrate"]
run = "bunx next dev"

[tasks.start]
description = "Start the production build with Next.js."
run = "bunx next start"

[tasks.preview]
description = "Serve the OpenNext build locally in workerd."
run = "bunx opennextjs-cloudflare preview"

[tasks.deploy]
description = "Migrate the production database, build and deploy the Worker."
depends = ["db:migrate:production"]
run = ["bunx opennextjs-cloudflare build", "bunx opennextjs-cloudflare deploy"]

[tasks."db:migrate"]
description = "Apply pending migrations to the local database."
run = "bunx wrangler d1 migrations apply DB --local"

[tasks."db:migrate:production"]
description = "Apply pending migrations to the production database."
run = "bunx wrangler d1 migrations apply DB --remote"

[tasks."db:generate"]
description = "Write a migration from the difference to the schema files."
run = "bunx drizzle-kit generate"

[tasks."db:seed"]
description = "Add the demo accounts and the catalogue to the local database."
run = "bun src/lib/db/seed.ts"

[tasks."db:seed:sql"]
description = "Write the catalogue as catalogue.sql for production."
run = "bun src/lib/db/seed-sql.ts"

[tasks."admin:create"]
description = "Create or promote an admin. --remote targets production."
run = "bun src/lib/db/create-admin.ts"

[tasks."covers:fetch"]
description = "Match book covers from Open Library. --remote targets production."
run = "bun scripts/fetch-covers.ts"
